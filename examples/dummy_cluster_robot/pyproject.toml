[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

packages = ["src/dummy_cluster_robot"]

[project]
name = "dummy-robot"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "destiny-robot-framework",
    "pydantic-settings",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
destiny-robot-framework = { git = "https://github.com/mcc-apsis/destiny-robot-framework.git" }
