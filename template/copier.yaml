robot_type:
  type: str
  help: Which type of robot do you want to create?
  choices:
    - base_robot
    - cluster_robot
  default: base_robot

robot_name:
  type: str
  help: Name of the robot
  placeholder: relevance_robot

robot_class:
  type: str
  default: "{{ robot_name | replace('_', ' ') | title | replace(' ', '') }}"
  when: false

description:
  type: str
  default: "Robot that creates enhancements."